
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>strangerz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #ffffff;
      --text: #111111;
      --text-dim: #666666;
      --text-muted: #aaaaaa;
      --bubble: rgba(255,255,255,0.92);
      --bubble-you: rgba(255,255,255,0.75);
      --shadow: 0 2px 12px rgba(0,0,0,0.10);
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.07);
    }

    html, body {
      height: 100%;
      height: -webkit-fill-available;
      font-family: 'DM Sans', -apple-system, sans-serif;
      font-size: 15px;
      color: var(--text);
      overflow: hidden;
    }

    /* ── GRADIENT BG (shared across all screens) ── */
    .grad-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 10% 10%, #f7c6d0 0%, transparent 60%),
        radial-gradient(ellipse 70% 70% at 90% 0%,  #ffd6a0 0%, transparent 55%),
        radial-gradient(ellipse 60% 80% at 80% 90%, #c9b8f0 0%, transparent 60%),
        radial-gradient(ellipse 80% 60% at 0% 80%,  #a8d8f0 0%, transparent 55%),
        radial-gradient(ellipse 60% 60% at 50% 50%, #fde8d0 0%, transparent 70%);
      background-color: #fdf0e8;
      animation: gradShift 12s ease infinite alternate;
    }
    @keyframes gradShift {
      0%   { filter: hue-rotate(0deg) brightness(1); }
      50%  { filter: hue-rotate(15deg) brightness(1.03); }
      100% { filter: hue-rotate(-10deg) brightness(0.98); }
    }

    /* Grain overlay */
    .grad-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.5;
    }

    /* ── SCREENS ── */
    .screen {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.97);
    }

    /* ══════════════════════════════════
       LANDING
    ══════════════════════════════════ */
    #screen-landing {
      align-items: center;
      justify-content: flex-end;
      padding: 0 24px;
      padding-bottom: max(40px, env(safe-area-inset-bottom, 40px));
    }

    .landing-content {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .landing-top {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .app-name {
      font-size: 38px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -1.5px;
    }

    .app-sub {
      font-size: 15px;
      color: var(--text-dim);
      font-weight: 400;
    }

    .online-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      border: 1px solid rgba(255,255,255,0.8);
    }
    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #34c759;
      animation: livePulse 2s ease infinite;
    }
    @keyframes livePulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

    .rules-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    .rule-pill {
      padding: 8px 14px;
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      border: 1px solid rgba(255,255,255,0.7);
    }

    .btn-start {
      width: 100%;
      padding: 17px;
      background: #111111;
      color: white;
      border: none;
      border-radius: 100px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: all 0.2s;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
    }
    .btn-start:hover { background: #333; transform: translateY(-1px); }
    .btn-start:active { transform: scale(0.98); }

    /* ══════════════════════════════════
       FINDING
    ══════════════════════════════════ */
    #screen-finding {
      align-items: center;
      justify-content: center;
      gap: 36px;
    }

    .radar-container {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .radar-ring {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      animation: radarPulse 2.4s ease-out infinite;
    }
    .radar-ring:nth-child(1) { width: 70px; height: 70px; animation-delay: 0s; }
    .radar-ring:nth-child(2) { width: 120px; height: 120px; animation-delay: 0.6s; }
    .radar-ring:nth-child(3) { width: 170px; height: 170px; animation-delay: 1.2s; }
    @keyframes radarPulse {
      0% { opacity: 0.7; transform: scale(0.4); }
      100% { opacity: 0; transform: scale(1); }
    }
    .radar-core {
      width: 64px; height: 64px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      box-shadow: var(--shadow);
      font-size: 28px;
    }

    .finding-label {
      text-align: center;
    }
    .finding-label h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }
    .finding-label p {
      margin-top: 6px;
      font-size: 14px;
      color: var(--text-dim);
    }
    #queue-pos {
      margin-top: 5px;
      font-size: 13px;
      color: var(--text-dim);
      font-weight: 600;
    }

    .btn-cancel-pill {
      padding: 13px 36px;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 100px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-cancel-pill:hover { color: #e53935; background: rgba(255,255,255,0.75); }

    /* ══════════════════════════════════
       CHAT
    ══════════════════════════════════ */
    #screen-chat { background: transparent; }

    /* Top bar */
    .chat-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top, 12px));
      z-index: 10;
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stranger-avatar {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border: 1.5px solid rgba(255,255,255,0.9);
    }

    .stranger-info {}
    .stranger-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }
    .stranger-status {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .topbar-right {
      display: flex;
      gap: 6px;
    }
    .topbar-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.8);
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      box-shadow: var(--shadow-sm);
      color: var(--text);
    }
    .topbar-btn:hover { background: rgba(255,255,255,0.85); transform: scale(1.05); }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    #messages::-webkit-scrollbar { width: 0; }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 78%;
      animation: msgPop 0.2s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes msgPop {
      from { opacity: 0; transform: scale(0.88) translateY(6px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .msg.you      { align-self: flex-end; align-items: flex-end; }
    .msg.stranger { align-self: flex-start; align-items: flex-start; }
    .msg.system   { align-self: center; max-width: 90%; }

    /* Consecutive messages — tighten gap */
    .msg.you + .msg.you,
    .msg.stranger + .msg.stranger { margin-top: -3px; }

    .bubble {
      padding: 11px 16px;
      border-radius: 22px;
      font-size: 15px;
      line-height: 1.45;
      word-break: break-word;
    }

    /* YOUR bubbles — slightly transparent white, right-aligned */
    .msg.you .bubble {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text);
      border-bottom-right-radius: 6px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.85);
    }

    /* STRANGER bubbles — more opaque white, left-aligned */
    .msg.stranger .bubble {
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text);
      border-bottom-left-radius: 6px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.95);
    }

    /* Consecutive: remove sharp corner on non-last */
    .msg.you + .msg.you .bubble { border-bottom-right-radius: 22px; border-top-right-radius: 6px; }
    .msg.stranger + .msg.stranger .bubble { border-bottom-left-radius: 22px; border-top-left-radius: 6px; }

    .msg.system .bubble {
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text-dim);
      font-size: 12px;
      text-align: center;
      border-radius: 100px;
      padding: 6px 14px;
      font-weight: 500;
    }

    .msg-time {
      font-size: 10px;
      color: rgba(0,0,0,0.35);
      margin-top: 3px;
      padding: 0 6px;
    }

    /* Typing */
    .typing-bubble {
      align-self: flex-start;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.95);
      border-radius: 22px;
      border-bottom-left-radius: 6px;
      padding: 13px 18px;
      box-shadow: var(--shadow);
      display: none;
      gap: 5px;
      align-items: center;
    }
    .typing-bubble.visible { display: flex; }
    .typing-bubble span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #bbb;
      animation: tDot 1.2s ease infinite;
    }
    .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes tDot {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* ── INPUT BAR ── */
    .input-area {
      padding: 8px 12px;
      padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
      flex-shrink: 0;
      z-index: 10;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .input-pill {
      flex: 1;
      display: flex;
      align-items: flex-end;
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255,255,255,0.9);
      border-radius: 26px;
      padding: 8px 8px 8px 16px;
      gap: 4px;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }
    .input-pill:focus-within {
      border-color: rgba(255,255,255,1);
      background: rgba(255,255,255,0.8);
    }

    #msg-input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--text);
      resize: none;
      outline: none;
      line-height: 1.4;
      max-height: 110px;
      min-height: 22px;
      padding: 3px 0;
    }
    #msg-input::placeholder { color: #aaa; }
    #msg-input:disabled { opacity: 0.4; }

    .btn-emoji-pill {
      width: 32px; height: 32px;
      border: none;
      background: transparent;
      font-size: 20px;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s;
      flex-shrink: 0;
      line-height: 1;
    }
    .btn-emoji-pill:hover { transform: scale(1.15); }

    .btn-send-circle {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: #111;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }
    .btn-send-circle svg { width: 18px; height: 18px; fill: white; margin-left: 2px; }
    .btn-send-circle:hover { background: #333; transform: scale(1.06); }
    .btn-send-circle:active { transform: scale(0.94); }
    .btn-send-circle:disabled { background: rgba(0,0,0,0.2); box-shadow: none; cursor: not-allowed; transform: none; }

    /* ── EMOJI PICKER ── */
    .emoji-picker {
      position: absolute;
      bottom: 75px;
      left: 12px;
      right: 12px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.95);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      padding: 12px;
      z-index: 100;
      display: none;
    }
    .emoji-picker.open { display: block; animation: emojiUp 0.2s ease; }
    @keyframes emojiUp {
      from { opacity: 0; transform: translateY(8px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .emoji-cats {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }
    .ecat {
      flex: 1;
      padding: 7px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .ecat.active { background: rgba(0,0,0,0.08); }
    .ecat:hover  { background: rgba(0,0,0,0.05); }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 2px;
      max-height: 150px;
      overflow-y: auto;
    }
    .emoji-grid::-webkit-scrollbar { width: 0; }
    .eg-btn {
      padding: 5px;
      border: none;
      background: transparent;
      font-size: 22px;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.1s;
      text-align: center;
      line-height: 1;
    }
    .eg-btn:hover { background: rgba(0,0,0,0.06); }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: white;
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.25s;
      z-index: 9999;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── CONNECTED FLASH ── */
    .conn-flash {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: flashOut 0.8s ease forwards;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 10% 10%, #f7c6d0 0%, transparent 60%),
        radial-gradient(ellipse 70% 70% at 90% 0%,  #ffd6a0 0%, transparent 55%),
        radial-gradient(ellipse 60% 80% at 80% 90%, #c9b8f0 0%, transparent 60%),
        radial-gradient(ellipse 80% 60% at 0% 80%,  #a8d8f0 0%, transparent 55%),
        #fdf0e8;
    }
    @keyframes flashOut {
      0%,60% { opacity: 1; }
      100%    { opacity: 0; }
    }
    .conn-flash-inner {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 28px 40px;
      text-align: center;
      animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }
    @keyframes popIn {
      from { opacity:0; transform: scale(0.7); }
      to   { opacity:1; transform: scale(1); }
    }
    .conn-flash-inner p { font-size: 13px; color: #666; margin-top: 4px; }

    @media (max-width: 480px) {
      .emoji-grid { grid-template-columns: repeat(7, 1fr); }
      .msg { max-width: 85%; }
    }
  </style>
</head>
<body>

<!-- GRADIENT BG (always visible) -->
<div class="grad-bg"></div>

<!-- ══ LANDING ══ -->
<div id="screen-landing" class="screen">
  <div class="landing-content">
    <div class="landing-top">
      <div class="app-name">strangerz</div>
      <div class="app-sub">Talk anonymously with someone new</div>
    </div>

    <div class="online-chip">
      <div class="live-dot"></div>
      <span id="online-count">—</span>&nbsp;online now
    </div>

    <div class="rules-pills">
      <div class="rule-pill">🤝 Be kind</div>
      <div class="rule-pill">🔒 No logs</div>
      <div class="rule-pill">👤 Anonymous</div>
      <div class="rule-pill">⏭️ Skip freely</div>
    </div>

    <button class="btn-start" onclick="startChat()">Find a Stranger</button>
  </div>
</div>

<!-- ══ FINDING ══ -->
<div id="screen-finding" class="screen hidden">
  <div class="radar-container">
    <div class="radar-ring"></div>
    <div class="radar-ring"></div>
    <div class="radar-ring"></div>
    <div class="radar-core">🔍</div>
  </div>

  <div class="finding-label">
    <h2>Finding someone…</h2>
    <p>Searching the world for a stranger</p>
    <div id="queue-pos"></div>
  </div>

  <button class="btn-cancel-pill" onclick="cancelSearch()">Cancel</button>
</div>

<!-- ══ CHAT ══ -->
<div id="screen-chat" class="screen hidden">

  <div class="chat-topbar">
    <div class="topbar-left">
      <div class="stranger-avatar">🎭</div>
      <div class="stranger-info">
        <div class="stranger-name">Stranger</div>
        <div class="stranger-status" id="stranger-status">connected</div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="topbar-btn" onclick="skipStranger()" title="Skip">⏭️</button>
      <button class="topbar-btn" onclick="endChat()" title="End">✕</button>
    </div>
  </div>

  <div id="messages">
    <div class="typing-bubble" id="typing-bubble">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Emoji Picker -->
  <div class="emoji-picker" id="emoji-picker">
    <div class="emoji-cats">
      <button class="ecat active" onclick="showCat('smileys')">😀</button>
      <button class="ecat" onclick="showCat('gestures')">👋</button>
      <button class="ecat" onclick="showCat('hearts')">❤️</button>
      <button class="ecat" onclick="showCat('nature')">🌿</button>
      <button class="ecat" onclick="showCat('objects')">🎮</button>
    </div>
    <div class="emoji-grid" id="emoji-grid"></div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <div class="input-pill">
        <textarea id="msg-input" placeholder="Message…" rows="1" maxlength="500"></textarea>
        <button class="btn-emoji-pill" id="emoji-toggle-btn" onclick="toggleEmoji()">😊</button>
      </div>
      <button class="btn-send-circle" id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── CONFIG ───────────────────────────────────────────────
const SERVER_URL = window.location.hostname === 'localhost'
  ? 'http://localhost:3000'
  : 'https://strangerz-backend-production.up.railway.app';

// ── EMOJI DATA ────────────────────────────────────────────
const EMOJIS = {
  smileys:  ['😀','😃','😄','😁','😆','😅','🤣','😂','🙂','🙃','😉','😊','😇','🥰','😍','🤩','😘','😋','😛','😜','🤪','😝','🤑','🤗','🤭','🤫','🤔','🤐','😐','😑','😶','😏','😒','🙄','😬','🤥','😌','😔','😪','😴','😷','🤒','🤕','🤢','🤧','🥵','🥶','😵','🤯','🥳','😎','🤓','🧐','😕','😟','🙁','☹️','😮','😲','😳','🥺','😦','😧','😨','😰','😢','😭','😱','😤','😡','😠','🤬','😈','👿','💀','☠️','🤡','👹','👺','👻','👽','👾','🤖'],
  gestures: ['👋','🤚','🖐','✋','🖖','👌','🤌','🤏','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','👇','☝️','👍','👎','✊','👊','🤛','🤜','👏','🙌','👐','🤲','🤝','🙏','💪','🦾','💅','🤳'],
  hearts:   ['❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❣️','💕','💞','💓','💗','💖','💘','💝','💟','💌','💋','👄','💏','💑','🌹','🥀'],
  nature:   ['🌿','🍀','🌱','🌲','🌳','🌴','🌵','🎋','🍃','🍂','🍁','🍄','🌾','💐','🌷','🌹','🌺','🌸','🌼','🌻','🌞','🌙','⭐','🌟','🌈','❄️','🔥','💧','🌊','🐶','🐱','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐸','🐵','🦋','🐝','🌸'],
  objects:  ['🎮','🕹','🎲','🎯','🎳','🎸','🎹','🥁','🎧','📱','💻','📷','📸','🎥','⌚','📡','💡','🔦','🎁','🎀','🎊','🎉','🎈','🏆','🥇','🎭','🎨','🖼','🎬','🎤','🎵','🎶','🎼','📚','📖','✏️','🖊','📝','💼','🔑','🗝','🔒','🔓','💰','💳','🛒','✈️','🚀','🌍']
};

// ── STATE ─────────────────────────────────────────────────
let socket = null;
let isTyping = false;
let typingTimer = null;
let emojiOpen = false;
let currentCat = 'smileys';

// ── SOCKET ────────────────────────────────────────────────
function initSocket() {
  socket = io(SERVER_URL, { transports: ['websocket', 'polling'] });

  socket.on('connect', () => console.log('✓ connected'));
  socket.on('disconnect', () => showToast('Disconnected'));

  socket.on('online_count', n => {
    document.getElementById('online-count').textContent = n;
  });

  socket.on('queue_position', pos => {
    document.getElementById('queue-pos').textContent =
      pos > 1 ? `You're #${pos} in queue` : 'Almost there…';
  });

  socket.on('chat_start', ({ sessionId }) => {
    showConnectedFlash();
    setTimeout(() => {
      showScreen('chat');
      clearMessages();
      addSystemMsg('You\'re connected 👋 Say hi!');
      setStatus('online');
      unlockInput();
    }, 700);
  });

  socket.on('message', ({ text, timestamp }) => {
    hideTyping();
    setStatus('online');
    addMsg('stranger', text, timestamp);
  });

  socket.on('typing_start', () => { showTyping(); setStatus('typing…'); });
  socket.on('typing_stop',  () => { hideTyping(); setStatus('online'); });

  socket.on('stranger_disconnected', () => {
    hideTyping();
    addSystemMsg('Stranger left the chat');
    setStatus('offline');
    lockInput();
    showToast('Tap ⏭️ to find someone new');
  });

  socket.on('stranger_skipped', () => {
    addSystemMsg('Stranger skipped you');
    setStatus('offline');
    lockInput();
    showToast('You were skipped');
  });
}

// ── NAV ───────────────────────────────────────────────────
function showScreen(name) {
  ['landing','finding','chat'].forEach(s =>
    document.getElementById('screen-' + s).classList.toggle('hidden', s !== name)
  );
  closeEmoji();
}

function startChat() {
  if (!socket) initSocket();
  socket.emit('find_stranger');
  showScreen('finding');
  document.getElementById('queue-pos').textContent = '';
}

function cancelSearch() {
  socket.emit('cancel_search');
  showScreen('landing');
}

function skipStranger() {
  clearMessages();
  socket.emit('skip_stranger');
  showScreen('finding');
  document.getElementById('queue-pos').textContent = '';
  unlockInput();
}

function endChat() {
  socket.emit('end_chat');
  showScreen('landing');
}

// ── MESSAGES ──────────────────────────────────────────────
function addMsg(who, text, timestamp) {
  const msgs = document.getElementById('messages');
  const typing = document.getElementById('typing-bubble');
  const ts = timestamp || new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div><div class="msg-time">${ts}</div>`;
  msgs.insertBefore(div, typing);
  msgs.scrollTop = msgs.scrollHeight;
}

function addSystemMsg(text) {
  const msgs = document.getElementById('messages');
  const typing = document.getElementById('typing-bubble');
  const div = document.createElement('div');
  div.className = 'msg system';
  div.innerHTML = `<div class="bubble">${text}</div>`;
  msgs.insertBefore(div, typing);
  msgs.scrollTop = msgs.scrollHeight;
}

function clearMessages() {
  const msgs = document.getElementById('messages');
  const typing = document.getElementById('typing-bubble');
  msgs.innerHTML = '';
  msgs.appendChild(typing);
}

function sendMessage() {
  const inp = document.getElementById('msg-input');
  const text = inp.value.trim();
  if (!text || !socket) return;
  const ts = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  addMsg('you', text, ts);
  socket.emit('message', { text });
  inp.value = '';
  autoResize(inp);
  stopTypingEmit();
  closeEmoji();
}

// ── TYPING ────────────────────────────────────────────────
function showTyping() {
  document.getElementById('typing-bubble').classList.add('visible');
  document.getElementById('messages').scrollTop = 99999;
}
function hideTyping() {
  document.getElementById('typing-bubble').classList.remove('visible');
}
function stopTypingEmit() {
  if (isTyping) { socket?.emit('typing_stop'); isTyping = false; }
  clearTimeout(typingTimer);
}

// ── INPUT ─────────────────────────────────────────────────
const msgInput = document.getElementById('msg-input');

msgInput.addEventListener('input', () => {
  autoResize(msgInput);
  if (!isTyping) { isTyping = true; socket?.emit('typing_start'); }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => { isTyping = false; socket?.emit('typing_stop'); }, 1500);
});

msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 110) + 'px';
}

function lockInput() {
  msgInput.disabled = true;
  document.getElementById('send-btn').disabled = true;
}
function unlockInput() {
  msgInput.disabled = false;
  document.getElementById('send-btn').disabled = false;
  setTimeout(() => msgInput.focus(), 100);
}

// ── STATUS ────────────────────────────────────────────────
function setStatus(text) {
  document.getElementById('stranger-status').textContent = text;
}

// ── EMOJI ─────────────────────────────────────────────────
function toggleEmoji() {
  emojiOpen = !emojiOpen;
  document.getElementById('emoji-picker').classList.toggle('open', emojiOpen);
  if (emojiOpen) renderEmojis(currentCat);
}
function closeEmoji() {
  emojiOpen = false;
  document.getElementById('emoji-picker').classList.remove('open');
}
function showCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.ecat').forEach((b, i) => {
    b.classList.toggle('active', Object.keys(EMOJIS)[i] === cat);
  });
  renderEmojis(cat);
}
function renderEmojis(cat) {
  document.getElementById('emoji-grid').innerHTML =
    EMOJIS[cat].map(e => `<button class="eg-btn" onclick="insertEmoji('${e}')">${e}</button>`).join('');
}
function insertEmoji(emoji) {
  const inp = document.getElementById('msg-input');
  const pos = inp.selectionStart;
  inp.value = inp.value.slice(0, pos) + emoji + inp.value.slice(inp.selectionEnd);
  inp.selectionStart = inp.selectionEnd = pos + emoji.length;
  inp.focus();
  autoResize(inp);
  if (!isTyping) { isTyping = true; socket?.emit('typing_start'); }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => { isTyping = false; socket?.emit('typing_stop'); }, 1500);
}

document.addEventListener('click', e => {
  if (emojiOpen && !e.target.closest('#emoji-picker') && !e.target.closest('#emoji-toggle-btn'))
    closeEmoji();
});

// ── CONNECTED FLASH ───────────────────────────────────────
function showConnectedFlash() {
  const el = document.createElement('div');
  el.className = 'conn-flash';
  el.innerHTML = `<div class="conn-flash-inner"><div style="font-size:36px">👋</div><div style="font-size:17px;font-weight:700;margin-top:6px">Stranger found!</div><p>Say something nice</p></div>`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

// ── TOAST ─────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── UTILS ─────────────────────────────────────────────────
function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
</script>
</body>
</html>
